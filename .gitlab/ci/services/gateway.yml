# Gateway Service - Build & Test

build:gateway:
  stage: build
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/gateway
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - services/gateway/target/gateway-*.jar
    expire_in: 30 days
  only:
    - merge_requests
    - main
    - develop

test:gateway:
  stage: test
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/gateway
    - mvn clean test
  only:
    - merge_requests
    - main
    - develop
  allow_failure: true
