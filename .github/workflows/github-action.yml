name: CI/CD - RabbitMQ Branch

on:
  push:
    branches:
      - rabbitmq
  pull_request:
    branches:
      - rabbitmq

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/la-petite-maison-de-lepouvante

jobs:
  # ============================================
  # TESTS BACKEND
  # ============================================
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: user
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests for all services
        run: |
          for service in catalog order payment user notification gateway discovery config; do
            echo "========== Testing $service =========="
            cd services/$service
            mvn test \
              -Dspring.profiles.active=test \
              -Dspring.cloud.config.enabled=false \
              -Dspring.config.import= \
              -Dspring.rabbitmq.host=localhost \
              -Dspring.rabbitmq.port=5672 \
              -Dspring.rabbitmq.username=user \
              -Dspring.rabbitmq.password=password
            cd ../..
          done

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-backend
          path: "**/target/surefire-reports/TEST-*.xml"

  # ============================================
  # TESTS FRONTEND
  # ============================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Run tests
        working-directory: front
        env:
          CHROME_BIN: /usr/bin/chromium-browser
        run: npm run test -- --configuration=ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-frontend
          path: front/coverage/**/cobertura-coverage.xml

  # ============================================
  # SONARCLOUD BACKEND
  # ============================================
  sonar-backend:
    name: SonarCloud Backend Analysis
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: SonarCloud analysis for all services
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          for service in catalog order payment user notification gateway discovery config; do
            echo "========== Analyzing $service =========="
            cd services/$service
            mvn verify sonar:sonar \
              -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
              -Dsonar.projectName="la-petite-maison-de-lepouvante" \
              -Dsonar.organization=${SONAR_ORGANIZATION} \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${SONAR_TOKEN} \
              -Dspring.profiles.active=test \
              -Dspring.cloud.config.enabled=false \
              -Dspring.config.import= \
              -DskipTests=true
            cd ../..
          done

  # ============================================
  # SONARCLOUD FRONTEND
  # ============================================
  sonar-frontend:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectName="la-petite-maison-de-lepouvante"
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=front/src
            -Dsonar.exclusions=**/*.spec.ts,**/node_modules/**
            -Dsonar.javascript.lcov.reportPaths=front/coverage/lcov.info

  # ============================================
  # BUILD & PUSH IMAGES (GHCR)
  # ============================================
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend services
        run: |
          for service in discovery config gateway catalog payment order user notification; do
            echo "========== Building $service =========="
            docker buildx build \
              --cache-from type=gha,scope=$service \
              --cache-to   type=gha,mode=max,scope=$service \
              --push \
              -t ${{ env.REGISTRY }}/$service:${{ github.sha }} \
              -t ${{ env.REGISTRY }}/$service:latest \
              services/$service
          done

      - name: Build and push frontend
        run: |
          docker buildx build \
            --cache-from type=gha,scope=frontend \
            --cache-to   type=gha,mode=max,scope=frontend \
            --push \
            -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/frontend:latest \
            front

  # ============================================
  # DEPLOY LOCAL (self-hosted runner)
  # ============================================
  deploy:
    name: Deploy with RabbitMQ
    runs-on: [self-hosted, local-deploy]
    needs: [build]
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/la-petite-maison-de-lepouvante
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy full stack (including RabbitMQ)
        run: |
          docker compose pull
          docker compose down --remove-orphans
          docker compose up -d
          echo "✅ Deployment done! RabbitMQ available on http://localhost:15672 (user/password)"
