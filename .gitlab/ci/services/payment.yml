# Payment Service - Build & Test

build:payment:
  stage: build
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/payment
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - services/payment/target/payment-*.jar
    expire_in: 30 days
  only:
    - merge_requests
    - main
    - develop

test:payment:
  stage: test
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/payment
    - mvn clean test
  only:
    - merge_requests
    - main
    - develop
