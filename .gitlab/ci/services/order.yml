# Order Service - Build & Test

build:order:
  stage: build
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/order
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - services/order/target/order-*.jar
    expire_in: 30 days
  only:
    - merge_requests
    - main
    - develop

test:order:
  stage: test
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/order
    - mvn clean test
  only:
    - merge_requests
    - main
    - develop
