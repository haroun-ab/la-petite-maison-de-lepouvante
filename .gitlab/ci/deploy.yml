  stage: deploy
  image: node:24-alpine
  cache:
    paths:
      - front/node_modules/
  script:
    - echo "Déploiement du Frontend..."
    - cd front
    - npm ci
    - npm run build
    - # Ajouter commandes de déploiement (S3, Netlify, serveur, etc.)
  environment:
    name: production
    url: https://app.example.com
  only:
    - main
  when: manual
