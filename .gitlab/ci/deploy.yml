# Déploiement en production (Manuel)

deploy:config:
  stage: deploy
  image: maven:3.8.1-openjdk-17
  script:
    - echo "Déploiement du Config Server..."
    - cd services/config
    - # Ajouter commandes de déploiement (Docker, Kubernetes, etc.)
  environment:
    name: production
    url: http://config-server:9999
  only:
    - main
  when: manual

