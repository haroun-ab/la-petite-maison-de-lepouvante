spring.application.name=gateway
server.port=8888
spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway routes
#spring.cloud.gateway.server.webflux.routes[0].id=r1
#spring.cloud.gateway.server.webflux.routes[0].id=r1
#spring.cloud.gateway.server.webflux.routes[0].id=Path=/products/**
spring.cloud.gateway.server.webflux.routes[0].id=r1
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CATALOG
spring.cloud.gateway.server.webflux.routes[0].predicates=Path=/products/**

# activer les endpoints de monitoring Actuator
management.endpoints.web.exposure.include=*