services:
  # ============================================
  # INFRASTRUCTURE
  # ============================================

  discovery:
    build:
      context: ./services/discovery
      dockerfile: Dockerfile
    container_name: discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=discovery
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petite-maison-network

  config:
    build:
      context: ./services/config
      dockerfile: Dockerfile
    container_name: config
    ports:
      - "9999:9999"
    environment:
      - SPRING_APPLICATION_NAME=config
      - SERVER_PORT=9999
    depends_on:
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://config:9999/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petite-maison-network

  # ============================================
  # GATEWAY
  # ============================================

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8888:8888"
    environment:
      - SPRING_APPLICATION_NAME=gateway
      - SERVER_PORT=8888
      - SPRING_CONFIG_IMPORT=configserver:http://config:9999
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka
    depends_on:
      config:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://gateway:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petite-maison-network

  # ============================================
  # MICROSERVICES
  # ============================================

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    container_name: catalog
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=catalog
      - SERVER_PORT=8080
      - SPRING_CONFIG_IMPORT=configserver:http://config:9999
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka
    depends_on:
      config:
        condition: service_healthy
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://catalog:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - petite-maison-network

  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: payment
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=payment
      - SERVER_PORT=8081
      - SPRING_CONFIG_IMPORT=configserver:http://config:9999
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka
    depends_on:
      config:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - petite-maison-network

  order:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    container_name: order
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=order
      - SERVER_PORT=8082
      - SPRING_CONFIG_IMPORT=configserver:http://config:9999
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka
    depends_on:
      config:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - petite-maison-network

  user:
    build:
      context: ./services/user
      dockerfile: Dockerfile
    container_name: user
    ports:
      - "8083:8083"
    environment:
      - SPRING_APPLICATION_NAME=user
      - SERVER_PORT=8083
      - SPRING_CONFIG_IMPORT=configserver:http://config:9999
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka
    depends_on:
      config:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - petite-maison-network

  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    container_name: notification
    ports:
      - "8084:8084"
    environment:
      - SPRING_APPLICATION_NAME=notification
      - SERVER_PORT=8084
      - SPRING_CONFIG_IMPORT=configserver:http://config:9999
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://discovery:8761/eureka
    depends_on:
      config:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - petite-maison-network

  # ============================================
  # FRONTEND
  # ============================================

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - petite-maison-network

networks:
  petite-maison-network:
    driver: bridge

volumes:
  h2-data:
    driver: local
