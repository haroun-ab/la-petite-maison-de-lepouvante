server.port=8888

spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://discovery:8761/eureka

# ===== CATALOG =====
spring.cloud.gateway.routes[0].id=catalog-route
spring.cloud.gateway.routes[0].uri=lb://CATALOG
spring.cloud.gateway.routes[0].predicates=Path=/CATALOG/**
spring.cloud.gateway.routes[0].filters=StripPrefix=1

# ===== ORDER =====
spring.cloud.gateway.routes[1].id=order-route
spring.cloud.gateway.routes[1].uri=lb://ORDER
spring.cloud.gateway.routes[1].predicates=Path=/order/**
spring.cloud.gateway.routes[1].filters=StripPrefix=1

management.endpoints.web.exposure.include=*
