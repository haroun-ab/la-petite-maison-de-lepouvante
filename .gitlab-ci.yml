# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
- test
- build
- secret-detection

# Pipeline pour develop : build et test
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# Tests unitaires des services
test_services:
  stage: test
  image: maven:3.9.5-eclipse-temurin-21
  script:
    - echo "Running unit tests for all services..."
    - cd services/catalog && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../order && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../payment && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../user && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../notification && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../gateway && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../discovery && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
    - cd ../config && mvn test -Dspring.profiles.active=test -Dspring.cloud.config.enabled=false -Dspring.config.import=
  only:
    - develop
    - main
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  artifacts:
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    when: always
    when: always

# Tests du frontend
test_frontend:
  stage: test
  image: node:24-alpine
  before_script:
    - apk add --no-cache chromium
    - export CHROME_BIN=/usr/bin/chromium-browser
  script:
    - cd front
    - npm ci
    - npm run test -- --configuration=ci
  only:
    - develop
    - main
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - front/node_modules
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: front/coverage/**/cobertura-coverage.xml
    when: always

# Build des images Docker
build_services:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "Building Docker images..."
    - docker build -t $CI_REGISTRY_IMAGE/discovery:$CI_COMMIT_SHA services/discovery
    - docker build -t $CI_REGISTRY_IMAGE/config:$CI_COMMIT_SHA services/config
    - docker build -t $CI_REGISTRY_IMAGE/gateway:$CI_COMMIT_SHA services/gateway
    - docker build -t $CI_REGISTRY_IMAGE/catalog:$CI_COMMIT_SHA services/catalog
    - docker build -t $CI_REGISTRY_IMAGE/order:$CI_COMMIT_SHA services/order
    - docker build -t $CI_REGISTRY_IMAGE/payment:$CI_COMMIT_SHA services/payment
    - docker build -t $CI_REGISTRY_IMAGE/user:$CI_COMMIT_SHA services/user
    - docker build -t $CI_REGISTRY_IMAGE/notification:$CI_COMMIT_SHA services/notification
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA front
    - echo "Build completed successfully"
  only:
    - develop
    - main

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
