# User Service - Build & Test

build:user:
  stage: build
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/user
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - services/user/target/user-*.jar
    expire_in: 30 days
  only:
    - merge_requests
    - main
    - develop

test:user:
  stage: test
  image: maven:3.8.1-openjdk-17
  script:
    - cd services/user
    - mvn clean test
  only:
    - merge_requests
    - main
    - develop
